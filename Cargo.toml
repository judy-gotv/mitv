# Author: Passwd Word
[package]
name = "p2p-http-gateway"
version = "0.1.0"
edition = "2021"
description = "P2P (NagaSoft VJLive / ForceTV) to HTTP/HLS gateway with web frontend"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[profile.release]
opt-level = 3
strip = true
